<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 374 1085" role="img" aria-label="Краткая карта определения приоритета на перекрёстке">
<title>Кто кому уступает — карта решения</title>
<desc>Семь проверок: выезд с прилегающей территории, управление светофором или регулировщиком, знаки приоритета, покрытие, нераспознаваемое покрытие, равнозначные дороги, поворот главной дороги.</desc>
<rect width="374" height="1085" rx="17" fill="#f4f8f5"/>
<text x="18" y="38" fill="#1b3830" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="24" font-weight="730">Кто кому уступает?</text>
<text x="18" y="64" fill="#577268" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5">Краткая карта приоритета</text>
<g font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><g>
  <rect x="13" y="120" width="348" height="116" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="44" cy="162" r="25" fill="#e8f2ed"/><g transform="translate(26 144)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16h28M18 16v17" stroke="#93aba1" stroke-width="7"/><path d="M8 4v8M12 8H4"/><path d="M17 26h9m-3-4l4 4-4 4" stroke="#b06542"/></g>
  <text x="78" y="151" fill="#1d3a31" font-size="15" font-weight="700">Сначала определи место</text>
  <text x="78" y="188" font-size="13.8" fill="#4a5f58">Выезд со двора — не перекрёсток.</text><text x="78" y="207" font-size="13.8" fill="#4a5f58">Уступай участникам на дороге.</text></g>
<g>
  <rect x="13" y="247" width="348" height="116" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="44" cy="289" r="25" fill="#e8f2ed"/><g transform="translate(26 271)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="3" width="15" height="30" rx="5"/><circle cx="19.5" cy="10" r="2" fill="#bd6450" stroke="none"/><circle cx="19.5" cy="18" r="2" fill="#d2aa5b" stroke="none"/><circle cx="19.5" cy="26" r="2" fill="#70ad87" stroke="none"/></g>
  <text x="78" y="278" fill="#1d3a31" font-size="15" font-weight="700">Если движение регулируется</text>
  <text x="78" y="315" font-size="13.8" fill="#4a5f58">Руководствуйся регулировщиком</text><text x="78" y="334" font-size="13.8" fill="#4a5f58">или работающим светофором.</text></g>
<g>
  <rect x="13" y="374" width="348" height="116" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="44" cy="416" r="25" fill="#e8f2ed"/><g transform="translate(26 398)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="8" width="17" height="17" transform="rotate(45 17.5 16.5)" fill="#edc85c" stroke="#376554" stroke-width="2"/><path d="M17 29v5"/></g>
  <text x="78" y="405" fill="#1d3a31" font-size="15" font-weight="700">Проверь знаки приоритета</text>
  <text x="78" y="442" font-size="13.8" fill="#4a5f58">Знак может сделать грунтовую</text><text x="78" y="461" font-size="13.8" fill="#4a5f58">дорогу главной.</text></g>
<g>
  <rect x="13" y="501" width="348" height="116" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="44" cy="543" r="25" fill="#e8f2ed"/><g transform="translate(26 525)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="10" height="24" rx="2" fill="#657b7d" stroke="none"/><rect x="14" y="7" width="10" height="24" rx="2" fill="#c6beb0" stroke="none"/><rect x="26" y="7" width="10" height="24" rx="2" fill="#aa805b" stroke="none"/><path d="M7 10v18" stroke="#dcebe5" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="19" cy="14" r="1" fill="#647b78" stroke="none"/><circle cx="21" cy="23" r="1" fill="#647b78" stroke="none"/></g>
  <text x="78" y="532" fill="#1d3a31" font-size="15" font-weight="700">Если знаков нет — покрытие</text>
  <text x="78" y="569" font-size="13.8" fill="#4a5f58">Твёрдое → гравий → грунт.</text><text x="78" y="588" font-size="13.8" fill="#4a5f58">Короткая вставка асфальта не в счёт.</text></g>
<g>
  <rect x="13" y="628" width="348" height="116" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="44" cy="670" r="25" fill="#e8f2ed"/><g transform="translate(26 652)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3v30M3 18h30M7 7l22 22M29 7L7 29" stroke="#6798ad" stroke-width="1.9"/><circle cx="18" cy="18" r="3" fill="#d5e9ef" stroke="none"/></g>
  <text x="78" y="659" fill="#1d3a31" font-size="15" font-weight="700">Если покрытие не видно</text>
  <text x="78" y="696" font-size="13.8" fill="#4a5f58">Без знаков считай свою дорогу</text><text x="78" y="715" font-size="13.8" fill="#4a5f58">второстепенной.</text></g>
<g>
  <rect x="13" y="755" width="348" height="116" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="44" cy="797" r="25" fill="#e8f2ed"/><g transform="translate(26 779)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 24H25m-8-7l8 7-8 7" stroke="#3d8191"/><path d="M31 33V9m-7 7l7-7 4 5" stroke="#bd784f"/><circle cx="29" cy="4" r="2" fill="#bd784f" stroke="none"/></g>
  <text x="78" y="786" fill="#1d3a31" font-size="15" font-weight="700">Если дороги равнозначны</text>
  <text x="78" y="823" font-size="13.8" fill="#4a5f58">Уступи справа. При левом повороте</text><text x="78" y="842" font-size="13.8" fill="#4a5f58">учти встречного прямо / направо.</text></g>
<g>
  <rect x="13" y="882" width="348" height="116" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="44" cy="924" r="25" fill="#e8f2ed"/><g transform="translate(26 906)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h15q8 0 8 8v10" stroke="#69878b" stroke-width="7"/><path d="M5 12h15q8 0 8 8v10" stroke="#e1ece5" stroke-width="2" stroke-dasharray="3 4"/><path d="M21 24l7 7 6-7" stroke="#2c735d" stroke-width="2.5"/></g>
  <text x="78" y="913" fill="#1d3a31" font-size="15" font-weight="700">Если главная поворачивает</text>
  <text x="78" y="950" font-size="13.8" fill="#4a5f58">Внутри каждой группы дорог —</text><text x="78" y="969" font-size="13.8" fill="#4a5f58">правила равнозначных дорог.</text></g></g>
<path d="M19 1017H355" stroke="#d4e1d9"/>
<text x="20" y="1042" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#446158">Статус дорог → направление → манёвр.</text>
</svg>