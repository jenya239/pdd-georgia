<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 696" role="img" aria-label="Краткая карта определения приоритета на перекрёстке">
<title>Кто кому уступает — карта решения</title>
<desc>Восемь проверок: выезд с прилегающей территории, управление светофором или регулировщиком, знаки приоритета, покрытие, нераспознаваемое покрытие, равнозначные дороги, поворот главной дороги.</desc>
<rect width="760" height="696" rx="17" fill="#f4f8f5"/>
<text x="29" y="43" fill="#1b3830" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="27" font-weight="730">Кто кому уступает?</text>
<text x="29" y="72" fill="#577268" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5">Сначала выясняем статус места и дорог — затем очередность участников</text>
<g font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><g>
  <rect x="24" y="112" width="350" height="118" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="55" cy="154" r="25" fill="#e8f2ed"/><g transform="translate(37 136)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16h28M18 16v17" stroke="#93aba1" stroke-width="7"/><path d="M8 4v8M12 8H4"/><path d="M17 26h9m-3-4l4 4-4 4" stroke="#b06542"/></g>
  <text x="89" y="143" fill="#1d3a31" font-size="15.5" font-weight="700">Сначала определи место</text>
  <text x="89" y="180" font-size="13.8" fill="#4a5f58">Выезд со двора — не перекрёсток.</text><text x="89" y="199" font-size="13.8" fill="#4a5f58">Выезжая, уступай участникам на дороге.</text></g>
<g>
  <rect x="386" y="112" width="350" height="118" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="417" cy="154" r="25" fill="#e8f2ed"/><g transform="translate(399 136)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="3" width="15" height="30" rx="5"/><circle cx="19.5" cy="10" r="2" fill="#bd6450" stroke="none"/><circle cx="19.5" cy="18" r="2" fill="#d2aa5b" stroke="none"/><circle cx="19.5" cy="26" r="2" fill="#70ad87" stroke="none"/></g>
  <text x="451" y="143" fill="#1d3a31" font-size="15.5" font-weight="700">Если движение регулируется</text>
  <text x="451" y="180" font-size="13.8" fill="#4a5f58">Сигналы регулировщика или работающего</text><text x="451" y="199" font-size="13.8" fill="#4a5f58">светофора определяют движение.</text></g>
<g>
  <rect x="24" y="242" width="350" height="118" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="55" cy="284" r="25" fill="#e8f2ed"/><g transform="translate(37 266)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="8" width="17" height="17" transform="rotate(45 17.5 16.5)" fill="#edc85c" stroke="#376554" stroke-width="2"/><path d="M17 29v5"/></g>
  <text x="89" y="273" fill="#1d3a31" font-size="15.5" font-weight="700">Проверь знаки приоритета</text>
  <text x="89" y="310" font-size="13.8" fill="#4a5f58">Знаки могут сделать даже грунтовую</text><text x="89" y="329" font-size="13.8" fill="#4a5f58">дорогу главной.</text></g>
<g>
  <rect x="386" y="242" width="350" height="118" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="417" cy="284" r="25" fill="#e8f2ed"/><g transform="translate(399 266)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="10" height="24" rx="2" fill="#657b7d" stroke="none"/><rect x="14" y="7" width="10" height="24" rx="2" fill="#c6beb0" stroke="none"/><rect x="26" y="7" width="10" height="24" rx="2" fill="#aa805b" stroke="none"/><path d="M7 10v18" stroke="#dcebe5" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="19" cy="14" r="1" fill="#647b78" stroke="none"/><circle cx="21" cy="23" r="1" fill="#647b78" stroke="none"/></g>
  <text x="451" y="273" fill="#1d3a31" font-size="15.5" font-weight="700">Если знаков нет — покрытие</text>
  <text x="451" y="310" font-size="13.8" fill="#4a5f58">Твёрдое → гравий → грунт.</text><text x="451" y="329" font-size="13.8" fill="#4a5f58">Короткий асфальт у перекрёстка не в счёт.</text></g>
<g>
  <rect x="24" y="372" width="350" height="118" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="55" cy="414" r="25" fill="#e8f2ed"/><g transform="translate(37 396)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3v30M3 18h30M7 7l22 22M29 7L7 29" stroke="#6798ad" stroke-width="1.9"/><circle cx="18" cy="18" r="3" fill="#d5e9ef" stroke="none"/></g>
  <text x="89" y="403" fill="#1d3a31" font-size="15.5" font-weight="700">Если покрытие не видно</text>
  <text x="89" y="440" font-size="13.8" fill="#4a5f58">Без знаков приоритета считай</text><text x="89" y="459" font-size="13.8" fill="#4a5f58">свою дорогу второстепенной.</text></g>
<g>
  <rect x="386" y="372" width="350" height="118" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="417" cy="414" r="25" fill="#e8f2ed"/><g transform="translate(399 396)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 24H25m-8-7l8 7-8 7" stroke="#3d8191"/><path d="M31 33V9m-7 7l7-7 4 5" stroke="#bd784f"/><circle cx="29" cy="4" r="2" fill="#bd784f" stroke="none"/></g>
  <text x="451" y="403" fill="#1d3a31" font-size="15.5" font-weight="700">Если дороги равнозначны</text>
  <text x="451" y="440" font-size="13.8" fill="#4a5f58">Уступи справа. При повороте налево</text><text x="451" y="459" font-size="13.8" fill="#4a5f58">учитывай встречного прямо / направо.</text></g>
<g>
  <rect x="24" y="502" width="350" height="118" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
  <circle cx="55" cy="544" r="25" fill="#e8f2ed"/><g transform="translate(37 526)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h15q8 0 8 8v10" stroke="#69878b" stroke-width="7"/><path d="M5 12h15q8 0 8 8v10" stroke="#e1ece5" stroke-width="2" stroke-dasharray="3 4"/><path d="M21 24l7 7 6-7" stroke="#2c735d" stroke-width="2.5"/></g>
  <text x="89" y="533" fill="#1d3a31" font-size="15.5" font-weight="700">Если главная поворачивает</text>
  <text x="89" y="570" font-size="13.8" fill="#4a5f58">Внутри каждой группы дорог —</text><text x="89" y="589" font-size="13.8" fill="#4a5f58">правила равнозначных дорог.</text></g></g>
<g>
<rect x="386" y="502" width="350" height="118" rx="12" fill="white" stroke="#d8e6df" stroke-width="1.4"/>
<circle cx="417" cy="544" r="25" fill="#e8f2ed"/>
<g transform="translate(399 526)" fill="none" stroke="#286854" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<circle cx="18" cy="18" r="13"/><path d="M9 27L27 9" stroke="#b9664e" stroke-width="3.5"/>
</g>
<text x="451" y="533" fill="#1d3a31" font-size="15.5" font-weight="700">Остановка и стоянка</text>
<text x="451" y="570" font-size="13.8" fill="#4a5f58">На пересечении и ближе 5 м обычно</text>
<text x="451" y="589" font-size="13.8" fill="#4a5f58">нельзя останавливаться. У выезда</text>
<text x="451" y="608" font-size="13.8" fill="#4a5f58">со двора запрещена стоянка.</text>
</g>
<path d="M30 639H730" stroke="#d4e1d9"/>
<text x="31" y="664" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#446158">Статус дорог → направление → манёвр.</text>
</svg>