<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-label="Карта устройства дороги: тротуары, обочины, проезжая часть, полосы движения, разделительная полоса и положение пешехода за городом">
<rect width="760" height="590" rx="16" fill="#e6ede6"/>
<g font-family="Arial, sans-serif">
<text x="28" y="43" font-size="26" font-weight="700" fill="#29473e">Одна дорога — разные части</text>
<rect x="24" y="65" width="712" height="172" rx="12" fill="#c9ddc5"/>
<rect x="37" y="81" width="96" height="139" rx="5" fill="#e9dbbf"/><rect x="627" y="81" width="96" height="139" rx="5" fill="#e9dbbf"/>
<rect x="135" y="81" width="49" height="139" fill="#a9b0a6"/><rect x="576" y="81" width="49" height="139" fill="#a9b0a6"/>
<rect x="184" y="81" width="392" height="139" fill="#4f5c63"/>
<path d="M380 86v131" stroke="#f2e9d3" stroke-width="4" stroke-dasharray="15 10"/>
<rect x="244" y="131" width="80" height="39" rx="12" fill="#277fb5" stroke="#215b7c" stroke-width="2"/><rect x="263" y="138" width="40" height="24" rx="5" fill="#c6e9f4"/>
<rect x="434" y="131" width="80" height="39" rx="12" fill="#ce6356" stroke="#9f4237" stroke-width="2"/><rect x="454" y="138" width="40" height="24" rx="5" fill="#f5d5cc"/>
<path d="M224 151h-26m8-8-8 8 8 8M536 151h26m-8-8 8 8-8 8" fill="none" stroke="#f6f4e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#29473e" text-anchor="middle" font-size="14" font-weight="700">
<text x="85" y="112">Тротуар</text><text x="159" y="112" font-size="12">Обочина</text>
<text x="380" y="100" fill="#fff5df" font-size="19">Проезжая часть</text>
<text x="600" y="112" font-size="12">Обочина</text><text x="674" y="112">Тротуар</text>
</g>
<text x="380" y="254" fill="#48645a" font-size="15" text-anchor="middle">Все эти элементы могут входить в состав одной дороги.</text>
<rect x="24" y="273" width="347" height="126" rx="12" fill="#fff" stroke="#bdcfc5" stroke-width="1.6"/>
<text x="43" y="300" font-size="19" font-weight="700" fill="#2f5748">Линия ≠ разделительная полоса</text>
<rect x="47" y="316" width="124" height="44" rx="4" fill="#515d64"/><path d="M109 318v39" stroke="#f7efda" stroke-width="3"/>
<rect x="218" y="316" width="124" height="44" rx="4" fill="#515d64"/><rect x="278" y="316" width="7" height="44" fill="#9dbd83"/>
<text x="109" y="379" font-size="14" text-anchor="middle" fill="#516359">1 проезжая часть</text><text x="280" y="379" font-size="14" text-anchor="middle" fill="#516359">2 проезжие части</text>
<rect x="388" y="273" width="348" height="126" rx="12" fill="#fff" stroke="#bdcfc5" stroke-width="1.6"/>
<text x="407" y="300" font-size="19" font-weight="700" fill="#2f5748">Полоса есть и без краски</text>
<rect x="414" y="318" width="290" height="46" rx="5" fill="#515d64"/>
<rect x="448" y="326" width="69" height="31" rx="10" fill="#277fb5"/><rect x="598" y="326" width="69" height="31" rx="10" fill="#ce6356"/>
<text x="558" y="384" font-size="15" text-anchor="middle" fill="#516359">Число полос задаёт не только разметка.</text>
<rect x="24" y="413" width="347" height="145" rx="12" fill="#fff" stroke="#bdcfc5" stroke-width="1.6"/>
<text x="43" y="441" font-size="19" font-weight="700" fill="#2f5748">Обочина не запасная полоса</text>
<rect x="45" y="457" width="299" height="44" rx="5" fill="#4f5c63"/><rect x="45" y="501" width="299" height="12" fill="#a9b0a6"/>
<rect x="83" y="465" width="78" height="28" rx="9" fill="#277fb5"/>
<text x="43" y="540" font-size="15" fill="#516359">По ней нельзя объезжать обычный затор.</text>
<rect x="388" y="413" width="348" height="145" rx="12" fill="#fff" stroke="#bdcfc5" stroke-width="1.6"/>
<text x="407" y="441" font-size="19" font-weight="700" fill="#2f5748">Пешеход за городом</text>
<rect x="408" y="456" width="309" height="43" rx="5" fill="#515d64"/><rect x="408" y="499" width="309" height="13" fill="#a9b0a6"/>
<rect x="578" y="463" width="73" height="29" rx="9" fill="#ce6356"/><circle cx="479" cy="506" r="6" fill="#293e4b"/>
<path d="M463 506h-28m10-8-10 8 10 8" fill="none" stroke="#35754e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="407" y="539" font-size="15" fill="#516359">На обочине идёт навстречу потоку.</text>
</g></svg>
