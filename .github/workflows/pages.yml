# GitHub Actions workflow template. It lives in ci/ (not .github/workflows/) because the
# token used to push this repo has no `workflow` scope. To enable it, copy it once with a
# token/UI that can write workflows, then set Pages to "GitHub Actions":
#   mkdir -p .github/workflows && cp ci/pages.yml .github/workflows/pages.yml
# The workflow publishes the already built site/ directory. It does not rebuild it.
name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
