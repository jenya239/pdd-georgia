# Temporary one-shot regeneration of the committed GitHub Pages build.
# Remove this workflow after the regenerated site commit succeeds.
name: sync-visual-once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-visual-once.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: node node_modules/prisma/build/index.js generate
      - name: Rebuild entire Pages tree from sources
        run: node tools/build.mjs
      - name: Commit only freshly generated site files
        run: |
          git add site/
          if git diff --cached --quiet; then
            echo "Build already matches published tree"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate Pages release after visual lesson revisions'
          git push origin HEAD:main
