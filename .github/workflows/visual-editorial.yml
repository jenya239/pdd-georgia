name: visual-editorial
on:
  push:
    branches: [main]
    paths:
      - 'content/lessons/**'
      - 'content/ontology/**'
      - 'content/plan/visual-editorial-review.json'
      - 'packages/lesson/**'
      - 'site/lessons/**'
      - 'site/data/tickets.json'
      - 'site/norm/**'
      - 'site/visual.html'
      - 'site/index.html'
      - 'site/course.html'
      - 'web/**'
      - 'packages/intersection/**'
      - 'site/assets/intersection/**'
      - 'site/assets/pages/intersection.mjs'
      - 'tests/js/intersection-*.test.mjs'
      - 'tools/visual-editorial-audit.mjs'
      - 'tools/editorial/**'
      - 'tests/js/visual-editorial.test.mjs'
      - 'tests/js/ep01-editorial.test.mjs'
      - 'tests/js/ep02-editorial.test.mjs'
      - 'tests/js/course-narrative-blocks.test.mjs'
      - 'docs/course-narrative-blocks-0-1.md'
      - 'packages/lesson/ep07.ts'
      - 'packages/lesson/ep08.ts'
      - 'video/episodes/ep03/v2/**'
      - 'tools/ep03-v2.mjs'
      - 'AGENTS.md'
      - 'tests/js/ep03-v2-preproduction.test.mjs'
      - 'tests/js/lesson-quotes.test.mjs'
      - '.github/workflows/visual-editorial.yml'
  pull_request:
    paths:
      - 'content/lessons/**'
      - 'content/ontology/**'
      - 'content/plan/visual-editorial-review.json'
      - 'packages/lesson/**'
      - 'site/lessons/**'
      - 'site/data/tickets.json'
      - 'site/norm/**'
      - 'site/visual.html'
      - 'site/index.html'
      - 'site/course.html'
      - 'web/**'
      - 'packages/intersection/**'
      - 'site/assets/intersection/**'
      - 'site/assets/pages/intersection.mjs'
      - 'tests/js/intersection-*.test.mjs'
      - 'tools/visual-editorial-audit.mjs'
      - 'tools/editorial/**'
      - 'tests/js/visual-editorial.test.mjs'
      - 'tests/js/ep01-editorial.test.mjs'
      - 'tests/js/ep02-editorial.test.mjs'
      - 'tests/js/course-narrative-blocks.test.mjs'
      - 'docs/course-narrative-blocks-0-1.md'
      - 'packages/lesson/ep07.ts'
      - 'packages/lesson/ep08.ts'
      - 'video/episodes/ep03/v2/**'
      - 'tools/ep03-v2.mjs'
      - 'AGENTS.md'
      - 'tests/js/ep03-v2-preproduction.test.mjs'
      - 'tests/js/lesson-quotes.test.mjs'
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify visual lesson law links, accessibility, and ticket ontology
        run: node tools/visual-editorial-audit.mjs
      - name: Check cross-episode contextual narrative (blocks 0–1)
        run: node --test tests/js/course-narrative-blocks.test.mjs
      - name: Check episode 2 narrative and pedestrian evidence
        run: node --test tests/js/ep02-editorial.test.mjs
      - name: Check episode 1 narrative and evidence
        run: node --test tests/js/ep01-editorial.test.mjs
      - name: Validate ep03 v2 preproduction screenplay and law fixtures
        run: |
          node tools/ep03-v2.mjs --check
          node --test tests/js/ep03-v2-preproduction.test.mjs
      - name: Run visual editorial test
        run: node --test tests/js/visual-editorial.test.mjs
      - name: Syntax check browser entrypoints
        run: |
          node --check web/assets/pages/intersection.mjs
          node --check web/assets/pages/episode.mjs
      - name: Check intersection trainer behavior and texts
        run: node --test tests/js/intersection-*.test.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate typed Prisma client
        run: node node_modules/prisma/build/index.js generate
      - name: Validate TypeScript domain and course types
        run: |
          node node_modules/typescript/bin/tsc -p packages/domain --noEmit
          node node_modules/typescript/bin/tsc -p packages/course --noEmit
          node node_modules/typescript/bin/tsc -p packages/intersection --noEmit
      - name: Check statutory quotations and literary lesson regressions
        run: node --test tests/js/lesson-quotes.test.mjs
      - name: Verify committed site matches regenerated release
        run: node tools/build.mjs --check
