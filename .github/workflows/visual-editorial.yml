name: visual-editorial
on:
  push:
    branches: [main]
    paths:
      - 'content/lessons/**'
      - 'content/ontology/**'
      - 'content/plan/visual-editorial-review.json'
      - 'packages/lesson/**'
      - 'site/lessons/**'
      - 'site/data/tickets.json'
      - 'site/norm/**'
      - 'site/visual.html'
      - 'site/index.html'
      - 'site/course.html'
      - 'web/**'
      - 'tools/visual-editorial-audit.mjs'
      - 'tools/editorial/**'
      - 'tests/js/visual-editorial.test.mjs'
      - 'tests/js/lesson-quotes.test.mjs'
      - '.github/workflows/visual-editorial.yml'
  pull_request:
    paths:
      - 'content/lessons/**'
      - 'content/ontology/**'
      - 'content/plan/visual-editorial-review.json'
      - 'packages/lesson/**'
      - 'site/lessons/**'
      - 'site/data/tickets.json'
      - 'site/norm/**'
      - 'site/visual.html'
      - 'site/index.html'
      - 'site/course.html'
      - 'web/**'
      - 'tools/visual-editorial-audit.mjs'
      - 'tools/editorial/**'
      - 'tests/js/visual-editorial.test.mjs'
      - 'tests/js/lesson-quotes.test.mjs'
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify visual lesson law links, accessibility, and ticket ontology
        run: node tools/visual-editorial-audit.mjs
      - name: Run visual editorial test
        run: node --test tests/js/visual-editorial.test.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate typed Prisma client
        run: node node_modules/prisma/build/index.js generate
      - name: Validate TypeScript domain and course types
        run: |
          node node_modules/typescript/bin/tsc -p packages/domain --noEmit
          node node_modules/typescript/bin/tsc -p packages/course --noEmit
      - name: Check statutory quotations and literary lesson regressions
        run: node --test tests/js/lesson-quotes.test.mjs
      - name: Verify committed site matches regenerated release
        run: node tools/build.mjs --check
